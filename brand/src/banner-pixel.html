<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>PECUN X banner: pixel city</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:wght@500&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; width: 1500px; height: 500px; overflow: hidden; background: #2f7d1c; }
  canvas { position: absolute; inset: 0; width: 1500px; height: 500px; image-rendering: pixelated; }
  .copy {
    position: absolute; left: 0; right: 0; top: 150px; text-align: center; color: #ffffff;
  }
  .small { font-family: "Inter Tight", sans-serif; font-weight: 500; font-size: 40px; letter-spacing: -0.02em; }
  .big { font-family: "Anton", sans-serif; font-size: 120px; line-height: 1; margin-top: 4px; letter-spacing: 0.01em; }
  .big span { color: #b8ff9d; }
</style>
</head>
<body>
<canvas id="c" width="300" height="100"></canvas>
<div class="copy">
  <div class="small">Put your money</div>
  <div class="big"><span>TO WORK</span></div>
</div>
<script>
  // Drawn on a 300x100 grid, scaled 5x with no smoothing, so every block is a crisp pixel.
  const c = document.getElementById("c").getContext("2d");
  const W = 300, H = 100;
  const px = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };
  let seed = 9;
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

  // pixel clouds
  function cloud(x, y) {
    const rows = ["...####....", "..######...", ".#########.", "###########", "###########", ".#########."];
    rows.forEach((r, j) => [...r].forEach((ch, i) => ch === "#" && px(x + i, y + j, 1, 1, "#f5f8ef")));
    px(x + 1, y + 5, 9, 1, "#cfe8c2");
  }
  cloud(52, 8); cloud(8, 36); cloud(232, 22);

  // scattered pixel dashes, top corners
  [[4, 18], [10, 20], [16, 18], [12, 15], [272, 4], [280, 6], [288, 4], [284, 2], [262, 8]].forEach(([x, y]) => px(x, y, 3, 1, "#ffffff"));
  [[14, 22], [286, 9]].forEach(([x, y]) => px(x, y, 1, 1, "#ffffff"));

  // a building: body, windows, optional sign
  function building(x, w, h, body, win, opts = {}) {
    const top = H - h;
    px(x, top, w, h, body);
    px(x, top, w, 1, opts.edge || "rgba(0,0,0,0.25)");
    for (let yy = top + 3; yy < H - 3; yy += 4) {
      for (let xx = x + 2; xx < x + w - 2; xx += 3) {
        if (rand() > 0.18) px(xx, yy, 1, 2, win);
      }
    }
    if (opts.roof) px(x + Math.floor(w / 2) - 1, top - 4, 1, 4, body);
  }

  // left: quiet, cream and grey (the old way)
  const greys = ["#e8eadf", "#d4d8c8", "#c2c7b4", "#eef0e6"];
  let x = 0;
  [[18, 30], [14, 22], [22, 38], [16, 26], [20, 34], [12, 20]].forEach(([w, h], i) => {
    building(x, w, h, greys[i % greys.length], "#9aa08c", { roof: i % 3 === 0 });
    x += w;
  });

  // right: the city in PECUN colours
  const bodies = ["#0a0a0a", "#122018", "#b8ff9d", "#1c3a28", "#f5f8ef", "#0a0a0a"];
  const wins = ["#b8ff9d", "#9aee78", "#2f7d1c", "#b8ff9d", "#2f7d1c", "#b8ff9d"];
  x = 198;
  [[14, 34], [18, 52], [24, 72], [14, 30], [20, 60], [16, 44]].forEach(([w, h], i) => {
    building(x, w, h, bodies[i % bodies.length], wins[i % wins.length], { roof: i % 2 === 1 });
    x += w;
  });

  // the PECUN leaf as a pixel sign on the tallest tower
  const leaf = [
    "......##",
    "....###@",
    "...###@@",
    "..###@@@",
    ".###@@@.",
    ".##@@@..",
    "##@@@...",
    "#@@.....",
  ];
  const sx = 234, sy = 16;
  px(sx - 2, sy - 2, 12, 12, "#f5f8ef");
  leaf.forEach((r, j) => [...r].forEach((ch, i) => {
    if (ch === "#") px(sx + i, sy + j, 1, 1, "#0a0a0a");
    if (ch === "@") px(sx + i, sy + j, 1, 1, "#2f7d1c");
  }));

  // ground
  px(0, H - 2, W, 2, "#0a0a0a");
</script>
</body>
</html>
