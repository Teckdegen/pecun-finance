<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>PECUN on X: preview</title>
<style>
  html, body { margin: 0; width: 1200px; height: 560px; background: #ffffff; font-family: -apple-system, "Segoe UI", sans-serif; }
  .banner { width: 1200px; height: 400px; display: block; object-fit: cover; }
  .pfp {
    position: absolute; left: 32px; top: 300px; width: 200px; height: 200px; border-radius: 50%;
    border: 6px solid #ffffff; object-fit: cover; background: #2f7d1c;
  }
  .name { position: absolute; left: 36px; top: 512px; font-size: 22px; font-weight: 700; color: #0f1419; }
  .handle { position: absolute; left: 160px; top: 516px; font-size: 17px; color: #536471; }
</style>
</head>
<body>
<!-- ?banner=<file>&pfp=<file>, paths relative to this folder -->
<img class="banner" id="b" />
<img class="pfp" id="p" />
<div class="name">PECUN</div>
<div class="handle">@pecunfinance</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("b").src = q.get("banner") || "../pecun-banner-photo.png";
  document.getElementById("p").src = q.get("pfp") || "../pecun-pfp-deep-green.png";
</script>
</body>
</html>
